# Central config for Python tooling (pytest, coverage; ruff comes in Lesson 3.3).
# One file, versioned with the code: every developer and CI run the tools identically.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sparktext.settings"
# Match this project's naming: tests.py, test_*.py and tests_*.py (e.g. messaging/tests_ai.py)
python_files = ["tests.py", "test_*.py", "tests_*.py"]
testpaths = ["accounts", "campaigns", "compliance", "contacts", "core", "messaging", "website"]
addopts = [
    "-ra",               # summary of every non-passing test at the end
    "--strict-markers",  # a typo'd @pytest.mark.xyz is an error, not silently ignored
    "--strict-config",
]
filterwarnings = [
    "default",
]

[tool.coverage.run]
branch = true            # measure both sides of every if/else, not just lines
source = ["."]
omit = [
    ".venv/*",
    "*/migrations/*",
    "*/tests.py",
    "*/tests/*",
    "*/test_*.py",
    "*/tests_*.py",
    "manage.py",
    "sparktext/asgi.py",
    "sparktext/wsgi.py",
    "sparktext/celery.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# RATCHET: CI fails if coverage drops below this. Raise it as coverage improves; never lower it.
fail_under = 70          # baseline 2026-11-23: 72% (line + branch)
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# -----------------------------------------------------------------------------
# Ruff: linter + formatter (replaces flake8, isort, pyupgrade, black)
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py315"      # match the Python in the Docker image / venv
line-length = 120
extend-exclude = ["*/migrations/*", "staticfiles", "node_modules", "redis"]

[tool.ruff.lint]
# Explicit selection: we decide what is enforced, not the tool's changing defaults.
select = [
    "E4", "E7", "E9",  # pycodestyle: real errors (bad imports, statements, syntax)
    "F",               # pyflakes: undefined names, unused imports/variables  -> real bugs
    "B",               # flake8-bugbear: likely bugs and design problems
    "I",               # isort: consistent import order (auto-fixed)
    "UP",              # pyupgrade: modern syntax for our Python version (auto-fixed)
    "DJ",              # flake8-django: Django-specific pitfalls
]
ignore = [
    "DJ012",           # model inner-class ordering: style only, not worth the churn
]
# Next ratchet steps (enable once the team has reviewed the findings):
#   "S"   (security, partly covered by bandit in CI)  - 70 findings
#   "BLE" (blind `except Exception`)                    - 94 findings

[tool.ruff.lint.isort]
known-first-party = ["accounts", "campaigns", "compliance", "contacts", "core", "messaging", "sparktext", "website"]

[tool.ruff.format]
quote-style = "double"
