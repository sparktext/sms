# CI = Continuous Integration: every PR and every push to main is checked automatically on a
# clean GitHub-hosted machine. "Works on my machine" stops being an argument.
#
#   lint ─────┐
#   secrets ──┤
#   audit ────┼──► image (build → smoke test → push to GHCR, main only)
#   test ─────┘                                            │ push to main only
#                                                          ▼
#                                       deploy (deploy.yml: that exact image → production)
#
# The four checks run in PARALLEL (fast feedback). The image is only built from code that passed
# all of them, and production only ever runs an image that went through this whole pipeline.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button in the Actions tab

# A new push to the same PR cancels the old, now-pointless run. Runs on main are never cancelled:
# every commit on main must get its own verdict (and its own image).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the automatic GITHUB_TOKEN can only READ the repo, unless a job asks for more.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.15"      # same as the Dockerfile; bump both together
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Install ONLY ruff (seconds), at the exact version pinned in requirements-dev.txt.
      - run: pip install "$(grep -E '^ruff==' requirements-dev.txt | cut -d' ' -f1)"
      # --output-format=github turns findings into inline annotations on the PR's "Files changed".
      - run: ruff check --output-format=github .

  # ─────────────────────────────────────────────────────────────────────────────────────────────
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.30.1"   # same as .pre-commit-config.yaml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0           # FULL history: a key added in commit 1 and deleted in commit 2 is still leaked
      # Why here when pre-commit already runs gitleaks? Hooks are local and skippable (--no-verify,
      # or never installed). CI is the gate nobody can skip.
      - name: Install gitleaks (checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      # .gitleaksignore (reviewed false positives) is picked up automatically from the repo root.
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'

  # ─────────────────────────────────────────────────────────────────────────────────────────────
  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit==2.10.1
      # Checks every PRODUCTION dependency (requirements.txt) against known-vulnerability databases.
      # New CVEs appear daily, so a PR that changed nothing can still turn red here: that's the point.
      - run: pip-audit -r requirements.txt --progress-spinner off

  # ─────────────────────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Service containers: real Postgres and Redis next to the job, thrown away afterwards.
    # Same major versions as docker-compose.yml / production → no "passes on SQLite, fails on Postgres".
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres     # throwaway CI database, not a secret
          POSTGRES_DB: sparktext
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-real-secret-0123456789abcdefghijklmnopqrstuvwxyz
      # DEBUG=True like local dev: with False, SECURE_SSL_REDIRECT would 301 every test-client request.
      # Production-mode settings get their own gate below (check --deploy).
      DEBUG: "True"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sparktext
      DB_SSLMODE: disable
      REDIS_URL: redis://localhost:6379/0
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip                                   # reuse downloaded wheels between runs
          cache-dependency-path: requirements*.txt     # cache key changes when deps change
      - run: pip install -r requirements-dev.txt

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django deploy checks (production settings)
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: sparktext.example.com
        run: python manage.py check --deploy --fail-level WARNING

      - name: Run tests (parallel) with coverage gate
        # fail_under in pyproject.toml makes this step fail if coverage drops below the ratchet.
        run: pytest -n auto --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────────────────────
  image:
    name: Docker image
    needs: [lint, secrets, audit, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write          # only this job may push to GitHub Container Registry
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # 1) Build and load into the runner's Docker (not pushed yet). Layer cache lives in GitHub's
      #    Actions cache, so unchanged layers (apt, pip install) are reused across runs.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: sparktext:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Smoke test: does the image actually BOOT? Catches a broken CMD, missing package, bad
      #    settings import... things no unit test sees. /healthz needs no DB, so a dummy URL is fine.
      - name: Smoke test (container starts and /healthz answers)
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e SECRET_KEY=ci-smoke-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz \
            -e DATABASE_URL=postgres://none:none@127.0.0.1:5432/none \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            sparktext:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo; echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::container did not become healthy"; docker logs smoke; exit 1

      # 3) Push ONLY for main. PR images are never published: unreviewed code never becomes deployable.
      #    Tags: sha-<full commit sha> (immutable, what CD deploys) + main (moving "latest of main").
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha      # everything is cached from step 1 → this takes seconds

  # CD: runs the reusable deploy workflow with this commit's image (sha-<github.sha>).
  deploy:
    name: Deploy
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      sha: ${{ github.sha }}
    secrets: inherit
