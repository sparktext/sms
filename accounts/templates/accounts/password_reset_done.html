{% extends "accounts/base_auth.html" %}

{% block title %}Check Your Inbox – SparkText{% endblock %}

{% block content %}

<div class="text-center">
  <div class="icon-circle">
    <svg width="26" height="26" fill="none" stroke="#4f46e5" stroke-width="1.75" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
    </svg>
  </div>
  <h1 class="page-title">Check your inbox</h1>
  <p class="page-subtitle">
    If that email is registered with SparkText, we've sent a password reset link. It expires in <strong style="color:#1e293b;">1 hour</strong>.
  </p>
</div>

<a href="{% url 'account_login' %}" class="btn btn-primary" style="text-decoration:none;">
  ← Back to sign in
</a>

{% endblock %}
