<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Password changed – SparkText</title></head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:'Inter',system-ui,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:40px 16px;">
    <tr><td align="center">
      <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;max-width:560px;width:100%;">
        <tr>
          <td style="background:#0D1117;padding:28px 40px;text-align:center;">
            <a href="https://sparktext.si" target="_blank" style="text-decoration:none;display:inline-block;">
              <img src="https://sparktext.si/static/img/logo-dark.png" alt="SparkText" width="160" height="32" style="display:block;border:0;outline:none;text-decoration:none;margin:0 auto;" />
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:40px;">
            <h1 style="font-size:20px;font-weight:700;color:#0D1117;margin:0 0 12px;">
              🔐 Your password was changed
            </h1>
            <p style="font-size:15px;color:#4b5563;line-height:1.6;margin:0 0 16px;">
              Hi {{ user.email }},<br><br>
              Your SparkText password was successfully changed. If you made this change, no action is needed.
            </p>
            <div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:14px 16px;margin-bottom:24px;">
              <p style="font-size:14px;color:#991b1b;margin:0;">
                <strong>Didn't do this?</strong> Reset your password immediately and contact our support team.
              </p>
            </div>
            <table cellpadding="0" cellspacing="0">
              <tr>
                <td style="background:#ef4444;border-radius:8px;">
                  <a href="https://sparktext.si/accounts/password/reset/" style="display:inline-block;padding:12px 24px;color:#ffffff;font-weight:600;font-size:14px;text-decoration:none;">
                    Reset my password
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="background:#f9fafb;padding:20px 40px;border-top:1px solid #e5e7eb;">
            <p style="font-size:12px;color:#9ca3af;margin:0;text-align:center;">SparkText · https://sparktext.si</p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
