{% load static %}<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found (404) — SparkText</title>
  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
  <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="h-full flex items-center justify-center p-6 text-gray-900">
  <div class="max-w-md w-full bg-white rounded-3xl border border-gray-200/80 p-8 sm:p-10 text-center shadow-lg shadow-gray-100/50 space-y-6">
    <a href="/" class="inline-block transition-opacity hover:opacity-90">
      <img src="{% static 'img/logo.png' %}" alt="SparkText" class="h-9 w-auto mx-auto mb-1">
    </a>
    
    <div class="space-y-2">
      <span class="text-xs font-bold uppercase tracking-widest text-indigo-600">Error 404</span>
      <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">Page Not Found</h1>
      <p class="text-xs text-gray-500 leading-relaxed">
        The link you followed may be broken, or the page may have been moved or removed.
      </p>
    </div>

    <div class="pt-2 flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="/" class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs font-semibold text-gray-700 bg-gray-100 hover:bg-gray-200 transition">
        Home
      </a>
      <a href="/inbox/" class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 transition shadow-xs">
        Go to Dashboard →
      </a>
    </div>

    <div class="border-t border-gray-100 pt-4">
      <p class="text-[11px] text-gray-400">Need help? Email <a href="mailto:info@sparktext.si" class="text-indigo-600 hover:underline">info@sparktext.si</a></p>
    </div>
  </div>
</body>
</html>
