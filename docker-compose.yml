services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sparktext
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sparktext}   # local-dev only; override via shell/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    # "Is Postgres actually accepting connections?" - other services wait for this, not just for the container to start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sparktext"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --port 6380
    restart: always

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # "environment" overrides values from env_file, so containers always use the compose database
    environment: &app_env
      - REDIS_URL=redis://redis:6380?protocol=2&socket_timeout=30
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-sparktext}@db:5432/sparktext
    depends_on: &app_deps
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  ai_worker:
    build: .
    command: python manage.py run_ai_worker
    env_file:
      - .env
    environment: *app_env
    depends_on: *app_deps
    restart: always

  campaign_worker:
    build: .
    command: python manage.py run_campaign_worker
    env_file:
      - .env
    environment: *app_env
    depends_on: *app_deps
    restart: always

volumes:
  postgres_data:
