services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sparktext
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sparktext
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --port 6380
    restart: always

  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6380?protocol=2&socket_timeout=30
      - DB_HOST=db
    depends_on:
      - db
      - redis
    restart: always

  ai_worker:
    build: .
    command: python manage.py run_ai_worker
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6380?protocol=2&socket_timeout=30
      - DB_HOST=db
    depends_on:
      - db
      - redis
    restart: always

  campaign_worker:
    build: .
    command: python manage.py run_campaign_worker
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6380?protocol=2&socket_timeout=30
      - DB_HOST=db
    depends_on:
      - db
      - redis
    restart: always

volumes:
  postgres_data:
