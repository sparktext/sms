# Local stack that mirrors production: same image, same processes, same dependencies.
#   docker compose up --build        start everything
#   docker compose ps                see health status
#   docker compose logs -f web       follow logs (the app logs to stdout)

# Shared settings for every process that runs the SparkText image ("x-" = reusable YAML block).
x-app: &app
  build: .
  image: sparktext:local          # ONE image, built once, used by web AND both workers
  env_file:
    - .env
  # "environment" overrides values from env_file, so containers always use the compose services
  environment:
    - REDIS_URL=redis://redis:6380?protocol=2&socket_timeout=30
    - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-sparktext}@db:5432/sparktext
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: always

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sparktext
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sparktext}   # local-dev only; override via shell/.env
    volumes:
      - postgres_data:/var/lib/postgresql
    # "Is Postgres actually accepting connections?" - other services wait for this, not just for the container to start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sparktext"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --port 6380
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  web:
    <<: *app
    ports:
      - "8000:8000"
    # User uploads (e.g. custom notification sounds) live OUTSIDE the container,
    # so they survive rebuilds and redeploys. Containers must be disposable.
    volumes:
      - media_data:/app/media
    # Uses the image's HEALTHCHECK (GET /healthz)

  ai_worker:
    <<: *app
    command: python manage.py run_ai_worker
    # Workers don't serve HTTP, so the image's /healthz probe would always fail here.
    healthcheck:
      disable: true

  campaign_worker:
    <<: *app
    command: python manage.py run_campaign_worker
    healthcheck:
      disable: true

volumes:
  postgres_data:
  media_data:
